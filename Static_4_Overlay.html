<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', monospace;
      color: #e8e8e8;
      overflow: hidden;
      background: transparent;
      width: 1920px;
      height: 1080px;
    }

    /* CSS Grid Pattern statt einzelne SVG Linien */
    .grid-background {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(0deg, transparent 24%, rgba(255, 136, 0, 0.03) 25%, rgba(255, 136, 0, 0.03) 26%, transparent 27%, transparent 74%, rgba(255, 136, 0, 0.03) 75%, rgba(255, 136, 0, 0.03) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(255, 136, 0, 0.03) 25%, rgba(255, 136, 0, 0.03) 26%, transparent 27%, transparent 74%, rgba(255, 136, 0, 0.03) 75%, rgba(255, 136, 0, 0.03) 76%, transparent 27%, transparent);
      background-size: 80px 80px;
      z-index: 1;
    }

    /* Corners mit Glow-Animation */
    @keyframes cornerGlow {
      0%, 100% {
        opacity: 0.65;
        box-shadow: 0 0 10px rgba(255, 136, 0, 0.3);
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 20px rgba(255, 136, 0, 0.6);
      }
    }

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      z-index: 2;
      animation: cornerGlow 3s ease-in-out infinite;
    }

    .corner.top-left {
      top: 18px;
      left: 18px;
      border-top: 2px solid rgba(255, 136, 0, 0.65);
      border-left: 2px solid rgba(255, 136, 0, 0.65);
    }

    .corner.top-right {
      top: 18px;
      right: 18px;
      border-top: 2px solid rgba(255, 136, 0, 0.65);
      border-right: 2px solid rgba(255, 136, 0, 0.65);
    }

    .corner.bottom-left {
      bottom: 18px;
      left: 18px;
      border-bottom: 2px solid rgba(255, 136, 0, 0.65);
      border-left: 2px solid rgba(255, 136, 0, 0.65);
    }

    .corner.bottom-right {
      bottom: 18px;
      right: 18px;
      border-bottom: 2px solid rgba(255, 136, 0, 0.65);
      border-right: 2px solid rgba(255, 136, 0, 0.65);
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(5, 5, 7, 0.82);
      border-bottom: 1px solid rgba(255, 136, 0, 0.28);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 14px;
      z-index: 10;
    }

    .logo {
      height: 38px;
      width: 38px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(255, 136, 0, 0.4);
    }

    .channel-name {
      color: #ff8800;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    .separator-line {
      color: rgba(232, 232, 232, 0.12);
      flex: 1;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Marquee Animation */
    @keyframes marquee {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    .marquee-text {
      display: inline-block;
      animation: marquee 15s linear infinite;
      padding-left: 100%;
    }

    .stream-category {
      color: rgba(232, 232, 232, 0.4);
      font-size: 11px;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    /* Live Indicator */
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 16px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2222;
      box-shadow: 0 0 8px #ff2222;
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 8px #ff2222;
      }
      50% {
        opacity: 0.3;
        box-shadow: 0 0 4px #ff2222;
      }
    }

    .live-text {
      color: #ff5555;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    /* Bottom Bar */
    .bottom-bar {
      position: absolute;
      bottom: 22px;
      left: 22px;
      right: 22px;
      height: 50px;
      background: rgba(5, 5, 7, 0.75);
      border: 1px solid rgba(255, 136, 0, 0.18);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 18px;
      z-index: 10;
    }

    .bottom-logo {
      height: 32px;
      width: 32px;
      object-fit: contain;
      opacity: 0.7;
    }

    .divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 136, 0, 0.3);
    }

    .now-playing-label {
      color: #ff8800;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .now-playing-text {
      color: #e8e8e8;
      font-size: 11px;
      font-weight: 700;
      min-width: 200px;
    }

    .bottom-url {
      margin-left: auto;
      color: rgba(232, 232, 232, 0.35);
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* Glow Effect für Bottom Bar */
    @keyframes barGlow {
      0%, 100% {
        border-color: rgba(255, 136, 0, 0.18);
      }
      50% {
        border-color: rgba(255, 136, 0, 0.35);
      }
    }

    .bottom-bar {
      animation: barGlow 3s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <div style="position:absolute;inset:0;">
    <!-- Grid Background (CSS-basiert für bessere Performance) -->
    <div class="grid-background"></div>

    <!-- Corner Brackets mit Glow -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Top Bar mit Stream-Infos -->
    <div class="top-bar">
      <!-- Kleines Katzen-Icon (Mascot) -->
      <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <circle cx="18" cy="18" r="17" fill="rgba(5,5,7,0.9)" stroke="rgba(255,136,0,0.45)" stroke-width="1"/>
        <!-- Ears -->
        <polygon points="9,13 6,4 14,11" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.7"/>
        <polygon points="27,13 30,4 22,11" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.7"/>
        <!-- Head -->
        <ellipse cx="18" cy="18" rx="10" ry="9.5" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.7"/>
        <!-- Eyes -->
        <ellipse cx="14" cy="17" rx="2.5" ry="3" fill="#ff8800"/>
        <ellipse cx="22" cy="17" rx="2.5" ry="3" fill="#ff8800"/>
        <ellipse cx="14" cy="17" rx="1.5" ry="2.2" fill="#050507"/>
        <ellipse cx="22" cy="17" rx="1.5" ry="2.2" fill="#050507"/>
        <!-- Nose -->
        <polygon points="18,21 17,23 19,23" fill="#ff8800" opacity="0.7"/>
        <!-- Whiskers -->
        <line x1="4"  y1="20" x2="14" y2="21" stroke="#ff8800" stroke-width="0.5" opacity="0.4"/>
        <line x1="32" y1="20" x2="22" y2="21" stroke="#ff8800" stroke-width="0.5" opacity="0.4"/>
        <!-- Tiny star -->
        <polygon points="18,8 18.8,10.5 21.5,10.5 19.4,12 20.2,14.5 18,13 15.8,14.5 16.6,12 14.5,10.5 17.2,10.5" fill="#ff8800" opacity="0.6" transform="scale(0.5) translate(18,4)"/>
      </svg>
      <span class="channel-name">D4RKST3R</span>
      <span class="separator-line">
        <span class="marquee-text" id="marquee-content">──────────────────────────────────────────────────────────────────────────────────────────────</span>
      </span>
      <span class="stream-category" id="stream-category">GAME DESIGN STREAM</span>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
    </div>

    <!-- Bottom Bar mit "Now Playing" Info -->
    <div class="bottom-bar">
      <img src="logo.png" alt="Logo" class="bottom-logo">
      <div class="divider"></div>
      <span class="now-playing-label">NOW PLAYING</span>
      <span class="now-playing-text" id="now-playing">GTA5/FiveM Props</span>
      <span class="bottom-url" id="bottom-url">twitch.tv/D4RKST3R</span>
    </div>
  </div>

  <script>
    // URL-Parameter auslesen
    const urlParams = new URLSearchParams(window.location.search);

    // Game/Status Parameter
    const game = urlParams.get('game') || 'GTA5/FiveM Props';
    const category = urlParams.get('category') || 'GAME DESIGN STREAM';
    const url = urlParams.get('url') || 'twitch.tv/D4RKST3R';
    const marqueeText = urlParams.get('marquee') || '──────────────────────────────────────────────────────────────────────────────────────────────';
    const animateMarquee = urlParams.get('animate-marquee') !== 'false';

    // DOM-Elemente aktualisieren
    document.getElementById('now-playing').textContent = game;
    document.getElementById('stream-category').textContent = category;
    document.getElementById('bottom-url').textContent = url;

    // Marquee-Text mit Wiederholung für Schleife
    const marqueeElement = document.getElementById('marquee-content');
    marqueeElement.textContent = marqueeText + ' ' + marqueeText + ' ' + marqueeText;

    // Optional: Marquee-Animation deaktivieren
    if (!animateMarquee) {
      marqueeElement.style.animation = 'none';
    }

    // Dynamische Spiele-Liste (optional)
    // Format: ?games=GTA5,Coding,Design&interval=10 (Wechsel alle 10 Sekunden)
    const games = urlParams.get('games');
    const interval = parseInt(urlParams.get('interval')) || 0;

    if (games && interval > 0) {
      const gameList = games.split(',');
      let gameIndex = 0;
      const nowPlayingElement = document.getElementById('now-playing');

      setInterval(() => {
        gameIndex = (gameIndex + 1) % gameList.length;
        nowPlayingElement.textContent = gameList[gameIndex];
      }, interval * 1000);
    }
  </script>
</body>

</html>
