<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BRB — D4RKST3R</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      color: #e8e8e8;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      background: #050507;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
    }

    /* Subtle orange glow — same as Starting Soon */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(255,136,0,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 30% 30% at 80% 20%, rgba(255,136,0,0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* CSS Grid — same as Overlay & Starting Soon */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(0deg,   transparent 24%, rgba(255,136,0,0.03) 25%, rgba(255,136,0,0.03) 26%, transparent 27%,
                                transparent 74%, rgba(255,136,0,0.03) 75%, rgba(255,136,0,0.03) 76%, transparent 77%),
        linear-gradient(90deg,  transparent 24%, rgba(255,136,0,0.03) 25%, rgba(255,136,0,0.03) 26%, transparent 27%,
                                transparent 74%, rgba(255,136,0,0.03) 75%, rgba(255,136,0,0.03) 76%, transparent 77%);
      background-size: 80px 80px;
      z-index: 1;
    }

    /* Corner brackets — identical to Starting Soon & Overlay */
    @keyframes cornerGlow {
      0%, 100% { opacity: 0.55; box-shadow: 0 0 10px rgba(255,136,0,0.3); }
      50%       { opacity: 1;    box-shadow: 0 0 20px rgba(255,136,0,0.6); }
    }
    .corner {
      position: fixed;
      width: 40px;
      height: 40px;
      z-index: 5;
      animation: cornerGlow 3s ease-in-out infinite;
    }
    .corner.tl { top: 18px; left: 18px;  border-top: 2px solid #ff8800; border-left:  2px solid #ff8800; }
    .corner.tr { top: 18px; right: 18px; border-top: 2px solid #ff8800; border-right: 2px solid #ff8800; }
    .corner.bl { bottom: 18px; left: 18px;  border-bottom: 2px solid #ff8800; border-left:  2px solid #ff8800; }
    .corner.br { bottom: 18px; right: 18px; border-bottom: 2px solid #ff8800; border-right: 2px solid #ff8800; }

    /* Scan line */
    .scan-line {
      position: fixed;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff8800, transparent);
      top: 0; left: 0;
      z-index: 6;
      animation: scanDown 4s infinite;
    }
    @keyframes scanDown {
      0%   { top: 0%;   opacity: 0.5; }
      50%  {            opacity: 1;   }
      100% { top: 100%; opacity: 0.5; }
    }

    /* Main layout */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Cat mascot */
    .cat-mascot {
      width: 300px;
      height: 300px;
      margin-bottom: 28px;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 20px rgba(255,136,0,0.4));
      animation: catGlow 3s ease-in-out infinite;
    }
    @keyframes catGlow {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(255,136,0,0.28)); }
      50%       { filter: drop-shadow(0 0 30px rgba(255,136,0,0.5));  }
    }

    /* "KURZE PAUSE" label */
    .pause-label {
      color: rgba(255,136,0,0.35);
      font-size: 11px;
      letter-spacing: 7px;
      margin-bottom: 12px;
    }

    /* Dynamic status message */
    #dynamic-msg {
      font-size: 16px;
      letter-spacing: 3px;
      color: #ff8800;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      min-width: 400px;
    }
    @keyframes glitch {
      0%,100% { text-shadow: -2px 0 #ff4400,  2px 0 rgba(255,136,0,0.5); }
      50%      { text-shadow:  2px 0 #ff4400, -2px 0 rgba(255,136,0,0.5); }
    }
    #dynamic-msg.glitch { animation: glitch 0.25s; }

    /* BRB heading */
    .brb-text {
      color: #c0c0c0;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 14px;
    }

    /* Separator */
    .divider {
      width: 70px;
      height: 1px;
      background: #ff8800;
      margin: 16px auto;
      opacity: 0.5;
    }

    .subtitle {
      color: rgba(232,232,232,0.4);
      font-size: 13px;
      letter-spacing: 3px;
    }

    /* Timer */
    #timer {
      font-size: 100px;
      font-weight: 700;
      color: #ff8800;
      letter-spacing: -4px;
      line-height: 1;
      margin-top: 16px;
      text-shadow: 0 0 40px rgba(255,136,0,0.4);
    }

    /* Social pills */
    .socials {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    .social-pill {
      padding: 7px 18px;
      border: 1px solid rgba(255,136,0,0.25);
      color: rgba(255,136,0,0.6);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .footer {
      margin-top: 28px;
      color: rgba(232,232,232,0.1);
      font-size: 10px;
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scan-line"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="content">
    <img src="../assets/cat_brb.png" class="cat-mascot" alt="D4RKST3R Mascot">

    <div class="pause-label">KURZE PAUSE</div>
    <div id="dynamic-msg">></div>
    <div class="brb-text">BRB</div>
    <div class="divider"></div>
    <div class="subtitle">Gleich geht's weiter!</div>
    <div id="timer">00:00</div>

    <div class="socials">
      <div class="social-pill">DISCORD</div>
      <div class="social-pill">TWITTER/X</div>
      <div class="social-pill">YOUTUBE</div>
    </div>
    <div class="footer">D4RKST3R</div>
  </div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const minutes = parseInt(params.get('time'))   || 5;
    const reason  = params.get('reason') || 'default';
    const animate = params.get('animate') !== 'false';

    const messages = {
      coffee:      ['> BREWING COFFEE...', '> CAFFEINE INTAKE IN PROGRESS...', '> REFUELING SYSTEM...', '> ENERGY RESTORATION...'],
      systemcheck: ['> SYSTEM CHECK INITIATED...', '> VERIFYING INTEGRITY...', '> RUNNING DIAGNOSTICS...', '> OPTIMIZATION IN PROGRESS...'],
      technical:   ['> TECHNICAL DIFFICULTIES...', '> SYSTEM MAINTENANCE...', '> RESOLVING ISSUES...', '> REBOOTING...'],
      bio:         ['> BIO BREAK IN PROGRESS...', '> HUMAN MAINTENANCE...', '> BACK SHORTLY...', '> STANDBY...'],
      food:        ['> FUELING HUMAN HARDWARE...', '> NUTRITION INTAKE...', '> AFK: FOOD RUN...', '> BACK SOON...'],
      default:     ['> SYSTEM STANDBY...', '> LOADING RESOURCES...', '> INITIALIZING...', '> PROCESSING...'],
    };

    const activeMessages = messages[reason] || messages.default;
    const msgEl = document.getElementById('dynamic-msg');
    let i = 0;

    if (animate) {
      function nextMsg() {
        msgEl.textContent = activeMessages[i++ % activeMessages.length];
        if (Math.random() > 0.75) {
          msgEl.classList.add('glitch');
          setTimeout(() => msgEl.classList.remove('glitch'), 250);
        }
      }
      nextMsg();
      setInterval(nextMsg, 2000);
    } else {
      msgEl.textContent = '> SYSTEM STANDBY...';
    }

    // Countdown
    let remaining = minutes * 60;
    const timerEl = document.getElementById('timer');

    function tick() {
      if (remaining < 0) { timerEl.textContent = '00:00'; return; }
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = m + ':' + s;
      remaining--;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
