<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Starting Soon - Loading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            color: #e8e8e8;
            overflow: hidden;
            background: #050507;
            width: 1920px;
            height: 1080px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* SVG Hintergrund mit Scan-Effekt */
        svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: .04;
            z-index: 1;
        }

        /* Scan-Line Animation */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff8800, transparent);
            top: 0;
            left: 0;
            z-index: 3;
            animation: scanDown 4s infinite;
        }

        @keyframes scanDown {
            0% {
                top: 0%;
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0.5;
            }
        }

        /* Corner Styling */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            z-index: 2;
        }

        .top-left {
            top: 18px;
            left: 18px;
            border-top: 2px solid #ff8800;
            border-left: 2px solid #ff8800;
        }

        .top-right {
            top: 18px;
            right: 18px;
            border-top: 2px solid #ff8800;
            border-right: 2px solid #ff8800;
        }

        .bottom-left {
            bottom: 18px;
            left: 18px;
            border-bottom: 2px solid #ff8800;
            border-left: 2px solid #ff8800;
        }

        .bottom-right {
            bottom: 18px;
            right: 18px;
            border-bottom: 2px solid #ff8800;
            border-right: 2px solid #ff8800;
        }

        /* Loading Container */
        .loading-container {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #logo {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 136, 0, .6));
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 136, 0, .6));
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(255, 136, 0, .8));
            }
        }

        /* Loading Text Styling */
        .loading-text {
            font-size: 18px;
            letter-spacing: 3px;
            color: #ff8800;
            text-shadow: 0 0 10px rgba(255, 136, 0, 0.5);
            height: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .loading-text::after {
            content: '';
            display: inline-block;
            width: 12px;
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 49% {
                content: '▌';
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        /* Loading Bar */
        .loading-bar {
            width: 400px;
            height: 3px;
            background: rgba(255, 136, 0, 0.1);
            border: 1px solid rgba(255, 136, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, transparent, #ff8800, transparent);
            width: 30%;
            animation: loadingFill 2s ease-in-out infinite;
            box-shadow: 0 0 10px #ff8800;
        }

        @keyframes loadingFill {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        /* Progress Percentage */
        .progress-text {
            color: rgba(255, 136, 0, 0.6);
            font-size: 12px;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* Channel Info */
        .channel-info {
            margin-top: 60px;
            text-align: center;
        }

        .channel-name {
            color: #c0c0c0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 12px;
        }

        .channel-desc {
            color: rgba(232, 232, 232, .35);
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        .channel-url {
            margin-top: 28px;
            padding: 7px 20px;
            border: 1px solid rgba(255, 136, 0, .25);
            color: rgba(255, 136, 0, .6);
            font-size: 10px;
            letter-spacing: 3px;
            display: inline-block;
        }

        /* Glitch Effekt für Text */
        @keyframes glitch {
            0% {
                text-shadow: -2px 0 #ff0000, 2px 0 #00ff00;
            }
            20% {
                text-shadow: 2px 0 #ff0000, -2px 0 #00ff00;
            }
            40% {
                text-shadow: -2px 0 #00ff00, 2px 0 #ff0000;
            }
            60% {
                text-shadow: 2px 0 #00ff00, -2px 0 #ff0000;
            }
            80% {
                text-shadow: -2px 0 #ff0000, 2px 0 #00ff00;
            }
            100% {
                text-shadow: 2px 0 #ff0000, -2px 0 #00ff00;
            }
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }
    </style>
</head>

<body>
    <!-- SVG Hintergrund -->
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <line x1="0" y1="0" x2="0" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="80" y1="0" x2="80" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="160" y1="0" x2="160" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="240" y1="0" x2="240" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="320" y1="0" x2="320" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="400" y1="0" x2="400" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="480" y1="0" x2="480" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="560" y1="0" x2="560" y2="1080" stroke="#ff8800" stroke-width="0.4" />

        <line x1="800" y1="0" x2="800" y2="1080" stroke="#ff8800" stroke-width="0.4" />

        <line x1="1200" y1="0" x2="1200" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1280" y1="0" x2="1280" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1360" y1="0" x2="1360" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1520" y1="0" x2="1520" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1600" y1="0" x2="1600" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1680" y1="0" x2="1680" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1760" y1="0" x2="1760" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1840" y1="0" x2="1840" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1920" y1="0" x2="1920" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="0" x2="1920" y2="0" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="80" x2="1920" y2="80" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="160" x2="1920" y2="160" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="240" x2="1920" y2="240" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="320" x2="1920" y2="320" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="400" x2="1920" y2="400" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="480" x2="1920" y2="480" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="560" x2="1920" y2="560" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="640" x2="1920" y2="640" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="720" x2="1920" y2="720" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="800" x2="1920" y2="800" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="880" x2="1920" y2="880" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="960" x2="1920" y2="960" stroke="#ff8800" stroke-width="0.4" />
        <line x1="0" y1="1040" x2="1920" y2="1040" stroke="#ff8800" stroke-width="0.4" />
    </svg>

    <!-- Scan Line Animation -->
    <div class="scan-line"></div>

    <!-- Corner Ecken -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Loading Container -->
    <div class="loading-container">
        <img id="logo" src="logo.png" alt="Logo">

        <!-- Loading Text -->
        <div class="loading-text" id="loading-text">INITIALIZING</div>

        <!-- Loading Bar -->
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>

        <!-- Progress Prozent -->
        <div class="progress-text" id="progress-text">0%</div>

        <!-- Channel Info -->
        <div class="channel-info">
            <div class="channel-name">D4RKST3R</div>
            <div class="channel-desc">GAME DESIGN &nbsp;·&nbsp; LEVEL DESIGN &nbsp;·&nbsp; DEV TALK</div>
            <div class="channel-url">TWITCH.TV/D4RKST3R</div>
        </div>
    </div>

    <script>
        // Loading Nachrichten
        const loadingMessages = [
            "> INITIALIZING EMOTIONALDICE SERVER...",
            "> LOADING LORE FRIENDLY ASSETS...",
            "> COMPILING SHADERS...",
            "> SYNCING GITHUB REPOSITORIES...",
            "> MOUNTING QBCORE FRAMEWORK...",
            "> VERIFYING STREAM INTEGRITY...",
            "> OPTIMIZING VIDEO CODEC...",
            "> LOADING OVERLAY MODULES...",
            "> FINALIZING SYSTEM BOOT...",
        ];

        const loadingTextElement = document.getElementById('loading-text');
        const progressTextElement = document.getElementById('progress-text');
        const logoElement = document.getElementById('logo');

        let currentMessageIndex = 0;
        let progress = 0;

        // Funktion zum Wechseln der Loading-Nachricht
        function updateLoadingMessage() {
            loadingTextElement.textContent = loadingMessages[currentMessageIndex];
            
            // Zufälliger Glitch-Effekt
            if (Math.random() > 0.7) {
                loadingTextElement.classList.add('glitch');
                setTimeout(() => {
                    loadingTextElement.classList.remove('glitch');
                }, 300);
            }

            currentMessageIndex = (currentMessageIndex + 1) % loadingMessages.length;
        }

        // Funktion zum Aktualisieren des Progress
        function updateProgress() {
            progress += Math.random() * 15;
            if (progress > 95) progress = 95;

            progressTextElement.textContent = Math.floor(progress) + '%';
        }

        // Initial
        updateLoadingMessage();

        // Loading Text alle 1.5 Sekunden wechseln
        const messageInterval = setInterval(updateLoadingMessage, 1500);

        // Progress alle 800ms aktualisieren
        const progressInterval = setInterval(updateProgress, 800);

        // URL-Parameter prüfen für Auto-Start
        const urlParams = new URLSearchParams(window.location.search);
        const duration = parseInt(urlParams.get('duration')) || 10;

        // Nach bestimmter Zeit komplett laden
        setTimeout(() => {
            clearInterval(messageInterval);
            clearInterval(progressInterval);

            progress = 100;
            progressTextElement.textContent = '100%';
            loadingTextElement.textContent = '> SYSTEM READY...';
            
            // Fade Out nach 2 Sekunden
            setTimeout(() => {
                document.querySelector('.loading-container').style.animation = 'fadeOut 1s forwards';
                logoElement.style.animation = 'none';
            }, 2000);
        }, duration * 1000);

        // Fade Out Animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Optional: Bei Klick Skip
        document.addEventListener('click', () => {
            clearInterval(messageInterval);
            clearInterval(progressInterval);
            progress = 100;
            progressTextElement.textContent = '100%';
            loadingTextElement.textContent = '> SYSTEM READY...';
            document.querySelector('.loading-container').style.animation = 'fadeOut 0.5s forwards';
        });
    </script>
</body>

</html>
