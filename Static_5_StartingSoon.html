<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Starting Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            color: #e8e8e8;
            overflow: hidden;
            background: #050507;
            width: 1920px;
            height: 1080px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* Styling für den Timer Text */
        #timer-container {
            font-size: 120px;
            font-weight: bold;
            color: #ff8800;
            /* Passend zu deinen Akzenten */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #custom-text {
            font-size: 50px;
            margin-bottom: 20px;
            letter-spacing: 5px;
            z-index: 10;
        }

        /* Dein SVG-Hintergrund und die Rahmen (aus deinem Code übernommen) */
        svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: .04;
            z-index: 1;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            z-index: 2;
        }

        .top-left {
            top: 18px;
            left: 18px;
            border-top: 2px solid #ff8800;
            border-left: 2px solid #ff8800;
        }

        .top-right {
            top: 18px;
            right: 18px;
            border-top: 2px solid #ff8800;
            border-right: 2px solid #ff8800;
        }

        .bottom-left {
            bottom: 18px;
            left: 18px;
            border-bottom: 2px solid #ff8800;
            border-left: 2px solid #ff8800;
        }

        .bottom-right {
            bottom: 18px;
            right: 18px;
            border-bottom: 2px solid #ff8800;
            border-right: 2px solid #ff8800;
        }
    </style>
</head>

<body>
    <!-- Hintergrund (Dein bestehendes SVG) -->
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <!-- Deine Linien (aus Platzgründen hier verkürzt dargestellt) -->
        <line x1="0" y1="0" x2="0" y2="1080" stroke="#ff8800" stroke-width="0.4" />
        <line x1="1920" y1="0" x2="1920" y2="1080" stroke="#ff8800" stroke-width="0.4" />
    </svg>

    <!-- Deine Rahmen-Ecken -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Das Container-Element, in das wir den Timer und den Text schreiben -->
    <div id="custom-text">STARTING SOON</div>
    <div id="timer-container">00:00</div>


    <!-- Das JavaScript, das die URL ausliest und den Timer steuert -->
    <script>
        // 1. URL-Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);

        // 2. Zeit in Minuten aus URL holen (Standard: 5 Minuten, wenn nichts angegeben ist)
        const timerMinutes = parseInt(urlParams.get('time')) || 5;

        // 3. Optionalen Text aus URL holen (Standard: "STARTING SOON")
        const customText = urlParams.get('text') || "STARTING SOON";

        // Den Text im HTML anpassen
        document.getElementById('custom-text').innerText = customText;

        // 4. Timer-Logik
        // Wir rechnen die Minuten in Sekunden um (z.B. 5 Min = 300 Sek)
        let totalSeconds = timerMinutes * 60;
        const timerDisplay = document.getElementById('timer-container');

        // Funktion, um den Timer zu formatieren (z.B. "05:00")
        function updateTimerDisplay() {
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;

            // Führende Nullen hinzufügen (z.B. "5" -> "05")
            m = m < 10 ? "0" + m : m;
            s = s < 10 ? "0" + s : s;

            timerDisplay.innerText = m + ":" + s;
        }

        // Erstmaliges Anzeigen vor dem Start
        updateTimerDisplay();

        // Der eigentliche Countdown
        const countdownInterval = setInterval(() => {
            totalSeconds--;

            if (totalSeconds < 0) {
                // Timer ist abgelaufen
                clearInterval(countdownInterval);
                timerDisplay.innerText = "00:00"; // Oder ein anderer Text wie "GO!"
            } else {
                updateTimerDisplay();
            }
        }, 1000); // 1000 ms = 1 Sekunde
    </script>
</body>

</html>
