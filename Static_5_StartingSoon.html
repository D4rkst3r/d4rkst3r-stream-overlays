<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Starting Soon — D4RKST3R</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      color: #e8e8e8;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      background: #050507;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
    }

    /* Subtle orange center glow — matches panel aesthetic */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(255,136,0,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 30% 30% at 20% 80%, rgba(255,136,0,0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* CSS Grid — same as Overlay */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(0deg,   transparent 24%, rgba(255,136,0,0.03) 25%, rgba(255,136,0,0.03) 26%, transparent 27%,
                                transparent 74%, rgba(255,136,0,0.03) 75%, rgba(255,136,0,0.03) 76%, transparent 77%),
        linear-gradient(90deg,  transparent 24%, rgba(255,136,0,0.03) 25%, rgba(255,136,0,0.03) 26%, transparent 27%,
                                transparent 74%, rgba(255,136,0,0.03) 75%, rgba(255,136,0,0.03) 76%, transparent 77%);
      background-size: 80px 80px;
      z-index: 1;
    }

    /* Corner brackets — same animation as Overlay */
    @keyframes cornerGlow {
      0%, 100% { opacity: 0.55; box-shadow: 0 0 10px rgba(255,136,0,0.3); }
      50%       { opacity: 1;    box-shadow: 0 0 20px rgba(255,136,0,0.6); }
    }

    .corner {
      position: fixed;
      width: 40px;
      height: 40px;
      z-index: 5;
      animation: cornerGlow 3s ease-in-out infinite;
    }
    .corner.tl { top: 18px; left: 18px;  border-top: 2px solid #ff8800; border-left:  2px solid #ff8800; }
    .corner.tr { top: 18px; right: 18px; border-top: 2px solid #ff8800; border-right: 2px solid #ff8800; }
    .corner.bl { bottom: 18px; left: 18px;  border-bottom: 2px solid #ff8800; border-left:  2px solid #ff8800; }
    .corner.br { bottom: 18px; right: 18px; border-bottom: 2px solid #ff8800; border-right: 2px solid #ff8800; }

    /* Scan line */
    .scan-line {
      position: fixed;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff8800, transparent);
      top: 0; left: 0;
      z-index: 6;
      animation: scanDown 4s infinite;
      display: none;
    }
    .scan-line.active { display: block; }
    @keyframes scanDown {
      0%   { top: 0%;   opacity: 0.5; }
      50%  {            opacity: 1;   }
      100% { top: 100%; opacity: 0.5; }
    }

    /* Main content */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Cat mascot */
    .cat-mascot {
      width: 280px;
      height: 320px;
      margin-bottom: 32px;
      filter: drop-shadow(0 0 24px rgba(255,136,0,0.35));
      animation: catGlow 3s ease-in-out infinite;
    }
    @keyframes catGlow {
      0%, 100% { filter: drop-shadow(0 0 18px rgba(255,136,0,0.3)); }
      50%       { filter: drop-shadow(0 0 32px rgba(255,136,0,0.55)); }
    }

    /* Loading text */
    #loading-text {
      font-size: 16px;
      letter-spacing: 3px;
      color: #ff8800;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    #loading-text.active { display: flex; }
    @keyframes glitch {
      0%,100% { text-shadow: -2px 0 #ff4400, 2px 0 rgba(255,136,0,0.5); }
      50%      { text-shadow:  2px 0 #ff4400,-2px 0 rgba(255,136,0,0.5); }
    }
    #loading-text.glitch { animation: glitch 0.25s; }

    /* "STARTING SOON" label */
    #label {
      color: rgba(255,136,0,0.4);
      font-size: 16px;
      letter-spacing: 8px;
      margin-bottom: 12px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.8} }

    /* Timer */
    #timer {
      font-size: 112px;
      font-weight: 700;
      color: #ff8800;
      letter-spacing: -4px;
      line-height: 1;
      text-shadow: 0 0 40px rgba(255,136,0,0.4);
    }

    /* Divider */
    .divider {
      width: 320px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff8800, transparent);
      margin: 20px auto;
      opacity: 0.5;
    }

    .channel { color: #c0c0c0; font-size: 28px; font-weight: 700; letter-spacing: 12px; }
    .tagline { color: rgba(232,232,232,0.35); font-size: 12px; letter-spacing: 4px; margin-top: 8px; }
    .twitch-url {
      margin-top: 28px;
      padding: 7px 20px;
      border: 1px solid rgba(255,136,0,0.25);
      color: rgba(255,136,0,0.6);
      font-size: 10px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scan-line"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="content">
    <!-- Cat Mascot SVG — sitting, paw raised -->
    <svg class="cat-mascot" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow5a">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Octagon frame -->
      <polygon points="68,6 172,6 234,68 234,212 172,274 68,274 6,212 6,68"
        fill="rgba(5,5,7,0.8)" stroke="#ff8800" stroke-width="1.5" opacity="0.75" filter="url(#glow5a)"/>
      <polygon points="76,14 164,14 222,76 222,204 164,266 76,266 18,204 18,76"
        fill="none" stroke="#ff8800" stroke-width="0.4" opacity="0.25"/>

      <!-- HUD corner ticks -->
      <rect x="6"   y="6"   width="10" height="2.5" fill="#ff8800" opacity="0.5"/>
      <rect x="6"   y="6"   width="2.5" height="10" fill="#ff8800" opacity="0.5"/>
      <rect x="224" y="6"   width="10" height="2.5" fill="#ff8800" opacity="0.5"/>
      <rect x="231.5" y="6" width="2.5" height="10" fill="#ff8800" opacity="0.5"/>
      <rect x="6"   y="271.5" width="10" height="2.5" fill="#ff8800" opacity="0.5"/>
      <rect x="6"   y="264"   width="2.5" height="10" fill="#ff8800" opacity="0.5"/>
      <rect x="224" y="271.5" width="10" height="2.5" fill="#ff8800" opacity="0.5"/>
      <rect x="231.5" y="264" width="2.5" height="10" fill="#ff8800" opacity="0.5"/>

      <!-- Sparkles -->
      <circle cx="44"  cy="52"  r="2.5" fill="#ff8800" opacity="0.6"/>
      <circle cx="50"  cy="60"  r="1.2" fill="#ff8800" opacity="0.35"/>
      <circle cx="37"  cy="62"  r="1.5" fill="#ff8800" opacity="0.4"/>
      <circle cx="200" cy="48"  r="2"   fill="#ff8800" opacity="0.55"/>
      <circle cx="207" cy="58"  r="1.2" fill="#ff8800" opacity="0.3"/>
      <circle cx="194" cy="60"  r="1.5" fill="#ff8800" opacity="0.4"/>
      <circle cx="38"  cy="186" r="1.5" fill="#ff8800" opacity="0.3"/>
      <circle cx="202" cy="192" r="1.2" fill="#ff8800" opacity="0.3"/>

      <!-- Cat body -->
      <ellipse cx="118" cy="190" rx="48" ry="58" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.9" opacity="1"/>

      <!-- Cat head -->
      <ellipse cx="118" cy="120" rx="44" ry="42" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.9"/>

      <!-- Ears -->
      <polygon points="86,90 73,56 104,84" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.9"/>
      <polygon points="150,90 163,56 136,84" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.9"/>
      <!-- Inner ear fill -->
      <polygon points="88,88 77,62 102,82" fill="#1e0a00" opacity="0.75"/>
      <polygon points="148,88 159,62 138,82" fill="#1e0a00" opacity="0.75"/>

      <!-- Eyes -->
      <ellipse cx="101" cy="118" rx="9" ry="10" fill="#ff8800"/>
      <ellipse cx="135" cy="118" rx="9" ry="10" fill="#ff8800"/>
      <ellipse cx="101" cy="118" rx="6"   ry="8"  fill="#080808"/>
      <ellipse cx="135" cy="118" rx="6"   ry="8"  fill="#080808"/>
      <!-- Eye shine -->
      <circle cx="104" cy="114" r="2.2" fill="#ff8800" opacity="0.55"/>
      <circle cx="138" cy="114" r="2.2" fill="#ff8800" opacity="0.55"/>

      <!-- Nose + mouth -->
      <polygon points="118,131 115,136 121,136" fill="#ff8800" opacity="0.75"/>
      <path d="M115,137 Q118,141 121,137" stroke="#ff8800" stroke-width="0.9" fill="none" opacity="0.45"/>

      <!-- Whiskers -->
      <line x1="64"  y1="128" x2="108" y2="130" stroke="#ff8800" stroke-width="0.7" opacity="0.28"/>
      <line x1="64"  y1="136" x2="108" y2="134" stroke="#ff8800" stroke-width="0.7" opacity="0.28"/>
      <line x1="172" y1="128" x2="128" y2="130" stroke="#ff8800" stroke-width="0.7" opacity="0.28"/>
      <line x1="172" y1="136" x2="128" y2="134" stroke="#ff8800" stroke-width="0.7" opacity="0.28"/>

      <!-- Right arm raised (waving) -->
      <ellipse cx="162" cy="162" rx="20" ry="22" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.9"/>
      <!-- Raised paw toes -->
      <ellipse cx="154" cy="145" rx="6.5" ry="7.5" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.8"/>
      <ellipse cx="163" cy="142" rx="6.5" ry="7.5" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.8"/>
      <ellipse cx="172" cy="146" rx="6"   ry="7"   fill="#0c0c0e" stroke="#ff8800" stroke-width="0.8"/>

      <!-- Left arm resting -->
      <ellipse cx="74"  cy="178" rx="18" ry="16" fill="#0c0c0e" stroke="#ff8800" stroke-width="0.9"/>

      <!-- Star on belly -->
      <polygon points="118,172 121,181 131,181 123.5,187 126.5,196 118,190 109.5,196 112.5,187 105,181 115,181"
        fill="#ff8800" opacity="0.88"/>

      <!-- Tail curled -->
      <path d="M 158,238 Q 182,248 186,230 Q 190,212 174,215 Q 162,218 166,228"
        stroke="#ff8800" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.45"/>

      <!-- Body outer glow (subtle) -->
      <ellipse cx="118" cy="190" rx="48" ry="58" fill="none" stroke="#ff8800" stroke-width="3" opacity="0.08" filter="url(#glow5a)"/>
      <ellipse cx="118" cy="120" rx="44" ry="42" fill="none" stroke="#ff8800" stroke-width="3" opacity="0.08" filter="url(#glow5a)"/>
    </svg>

    <div id="loading-text"></div>
    <div id="label">STARTING SOON</div>
    <div id="timer">00:00</div>
    <div class="divider"></div>
    <div class="channel">D4RKST3R</div>
    <div class="tagline" id="tagline-text">GAME DESIGN &nbsp;·&nbsp; LEVEL DESIGN &nbsp;·&nbsp; DEV TALK</div>
    <div class="twitch-url">TWITCH.TV/D4RKST3R</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const timerMinutes = parseInt(params.get('time')) || 5;
    const customText   = params.get('text') || 'STARTING SOON';
    const tagline      = params.get('tagline') || 'GAME DESIGN · LEVEL DESIGN · DEV TALK';
    const loadingMode  = params.get('loading') === 'true';
    const scanMode     = params.get('scan')    === 'true';

    document.getElementById('label').textContent   = customText;
    document.getElementById('tagline-text').textContent = tagline;

    if (scanMode) document.querySelector('.scan-line').classList.add('active');

    // Countdown
    let remaining = timerMinutes * 60;
    const timerEl = document.getElementById('timer');

    function tick() {
      if (remaining < 0) { timerEl.textContent = '00:00'; return; }
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = m + ':' + s;
      remaining--;
    }
    tick();
    setInterval(tick, 1000);

    // Loading messages
    if (loadingMode) {
      const loadEl = document.getElementById('loading-text');
      loadEl.classList.add('active');
      const msgs = [
        '> INITIALIZING SERVER...',
        '> LOADING LORE FRIENDLY ASSETS...',
        '> COMPILING SHADERS...',
        '> SYNCING GITHUB REPOSITORIES...',
        '> MOUNTING QBCORE FRAMEWORK...',
        '> VERIFYING STREAM INTEGRITY...',
        '> OPTIMIZING VIDEO CODEC...',
        '> LOADING OVERLAY MODULES...',
        '> FINALIZING SYSTEM BOOT...',
      ];
      let i = 0;
      function nextMsg() {
        loadEl.textContent = msgs[i++ % msgs.length];
        if (Math.random() > 0.7) {
          loadEl.classList.add('glitch');
          setTimeout(() => loadEl.classList.remove('glitch'), 250);
        }
      }
      nextMsg();
      setInterval(nextMsg, 1500);
    }
  </script>
</body>
</html>
